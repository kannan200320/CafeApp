<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Terracotta Gradient -->
    <linearGradient id="coffeeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D98A58" />
      <stop offset="50%" stop-color="#C67C4E" />
      <stop offset="100%" stop-color="#93552D" />
    </linearGradient>

    <!-- Steam Gradient -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Premium Squircle Container -->
  <rect width="64" height="64" rx="16" fill="url(#coffeeBg)" />

  <!-- Inner Subtle Glass Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.25" />

  <!-- Coffee Emblem Group -->
  <g filter="url(#softShadow)">
    <!-- Rising Steam Wisps -->
    <path
      d="M24 21 C22.5 18.5, 25.5 16.5, 24 13.5"
      fill="none"
      stroke="url(#steamGrad)"
      stroke-width="2.2"
      stroke-linecap="round"
    />
    <path
      d="M30 20 C28.5 17, 31.5 15, 30 11.5"
      fill="none"
      stroke="url(#steamGrad)"
      stroke-width="2.4"
      stroke-linecap="round"
    />
    <path
      d="M36 21 C34.5 18.5, 37.5 16.5, 36 13.5"
      fill="none"
      stroke="url(#steamGrad)"
      stroke-width="2.2"
      stroke-linecap="round"
    />

    <!-- Saucer Plate -->
    <path
      d="M15 48 C19 51.5, 41 51.5, 45 48"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2.6"
      stroke-linecap="round"
    />

    <!-- Cup Body (Ceramic White) -->
    <path
      d="M18 26 C18 36, 21 44, 30 44 C39 44, 42 36, 42 26 Z"
      fill="#FFFFFF"
    />

    <!-- Cup Handle -->
    <path
      d="M40.5 29.5 H44 C47.5 29.5, 47.5 38.5, 40 38.5"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Terracotta Latte Art Heart -->
    <path
      d="M30 38.2 C27.5 35.8, 25 33.8, 25 32 C25 30.5, 26.2 29.4, 27.6 29.4 C28.6 29.4, 29.5 30, 30 30.7 C30.5 30, 31.4 29.4, 32.4 29.4 C33.8 29.4, 35 30.5, 35 32 C35 33.8, 32.5 35.8, 30 38.2 Z"
      fill="#C67C4E"
    />
  </g>
</svg>
