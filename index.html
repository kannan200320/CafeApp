<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#C67C4E" />
    <title>Coffee Shop — Blissful Delight</title>
    <!-- Google Fonts: Sora -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS CDN with configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sora: ['Sora', 'sans-serif'],
            },
            colors: {
              brand: {
                DEFAULT: '#C67C4E',
                hover: '#B36C3F',
                light: '#F9F2ED',
                peach: '#FFF5EE',
                dark: '#93552D',
              },
              coffee: {
                dark: '#2F2D2C',
                black: '#131313',
                charcoal: '#313131',
                input: '#2A2A2A',
                grey: '#9B9B9B',
                lightgrey: '#EDEDED',
                softgrey: '#F3F3F3',
                bg: '#F9F9F9',
                red: '#ED5151',
                yellow: '#FBBE21',
                border: '#EAEAEA',
              },
            },
            boxShadow: {
              'card': '0 8px 24px rgba(149, 157, 165, 0.1)',
              'sheet': '0 -8px 30px rgba(0, 0, 0, 0.08)',
            },
            borderRadius: {
              '2xl': '16px',
              '3xl': '24px',
              '4xl': '32px',
            },
          },
        },
      }
    </script>
  </head>
  <body class="bg-[#F0F0F2] font-sora text-coffee-dark antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
